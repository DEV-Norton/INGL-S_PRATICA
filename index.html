<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Trainer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, Roboto, sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
padding:20px;
}

.container{
width:100%;
max-width:420px;
padding:40px;
border-radius:18px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 20px 60px rgba(0,0,0,0.6);
text-align:center;
}

h1{
font-weight:600;
letter-spacing:1px;
margin-bottom:25px;
color:#e2e8f0;
}

#word{
font-size:42px;
font-weight:700;
margin:25px 0;
}

input{
margin-top:20px;
width:100%;
padding:12px;
border-radius:8px;
border:none;
outline:none;
font-size:16px;
text-align:center;
background:#020617;
color:white;
border:1px solid rgba(255,255,255,0.1);
}

.hidden{display:none;}

.buttons{
margin-top:20px;
display:flex;
flex-direction:column;
gap:12px;
}

button{
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
background:#1e293b;
color:#e2e8f0;
}

#translation{margin-top:10px;color:#22c55e;}
#past{margin-top:10px;color:#38bdf8;}
#result{margin-top:15px;font-weight:bold;}

</style>
</head>

<body>

<div class="container">

<h1>English Trainer</h1>

<div id="word">Click Random Word</div>

<input id="answer" class="hidden" placeholder="Type the past tense...">

<div class="buttons">

<button onclick="randomWord()">🎲 Random Word</button>

<button id="btnCheck" class="hidden" onclick="checkAnswer()">✅ Check Answer</button>

<button onclick="showTranslation()">📖 Show Translation</button>

<button id="btnPast" class="hidden" onclick="showPast()">⏳ Show Past</button>

</div>

<div id="translation"></div>
<div id="past"></div>
<div id="result"></div>

</div>

<script>

const words = [

/* VERBOS */
{en:"Be", pt:"ser / estar", past:"was / were", type:"verb"},
{en:"Have", pt:"ter", past:"had", type:"verb"},
{en:"Do", pt:"fazer", past:"did", type:"verb"},
{en:"Say", pt:"dizer", past:"said", type:"verb"},
{en:"Go", pt:"ir", past:"went", type:"verb"},
{en:"Get", pt:"pegar / conseguir", past:"got", type:"verb"},
{en:"Make", pt:"fazer / criar", past:"made", type:"verb"},
{en:"Know", pt:"saber / conhecer", past:"knew", type:"verb"},
{en:"Think", pt:"pensar", past:"thought", type:"verb"},
{en:"Take", pt:"pegar / levar", past:"took", type:"verb"},
{en:"See", pt:"ver", past:"saw", type:"verb"},
{en:"Drink", pt:"beber", past:"drank", type:"verb"},
{en:"Buy", pt:"comprar", past:"bought", type:"verb"},
{en:"Pretend", pt:"fingir", past:"pretended", type:"verb"},
{en:"Intend", pt:"pretender", past:"intended", type:"verb"},
{en:"Cook", pt:"cozinhar", past:"cooked", type:"verb"},
{en:"Sell", pt:"vender", past:"sold", type:"verb"},
{en:"Get used to", pt:"acostumar-se", past:"got used to", type:"verb"},
{en:"Leave", pt:"sair", past:"left", type:"verb"},
{en:"Give", pt:"dar", past:"gave", type:"verb"},
{en:"Feel", pt:"sentir", past:"felt", type:"verb"},
{en:"Help", pt:"ajudar", past:"helped", type:"verb"},
{en:"Find", pt:"achar / encontrar", past:"found", type:"verb"},
{en:"Run", pt:"correr", past:"ran", type:"verb"},
{en:"Eat", pt:"comer", past:"ate", type:"verb"},
{en:"Speak", pt:"falar", past:"spoke", type:"verb"},
{en:"Come", pt:"vir", past:"came", type:"verb"},
{en:"Bring", pt:"trazer", past:"brought", type:"verb"},
{en:"Begin", pt:"começar", past:"began", type:"verb"},
{en:"Write", pt:"escrever", past:"wrote", type:"verb"},
{en:"Set", pt:"colocar / ajustar", past:"set", type:"verb"},
{en:"Watch", pt:"assistir", past:"watched", type:"verb"},
{en:"Sleep", pt:"dormir", past:"slept", type:"verb"},
{en:"Break", pt:"quebrar", past:"broke", type:"verb"},
{en:"Wake up", pt:"acordar", past:"woke up", type:"verb"},
{en:"Get up", pt:"levantar", past:"got up", type:"verb"},
{en:"Wear", pt:"usar (roupa)", past:"wore", type:"verb"},

/* ADJETIVOS */
{en:"Afraid / Scared", pt:"com medo", type:"adjective"},
{en:"Sad", pt:"triste", type:"adjective"},
{en:"Nervous", pt:"nervoso", type:"adjective"},
{en:"Anxious", pt:"ansioso", type:"adjective"},
{en:"Excited", pt:"animado / empolgado", type:"adjective"},
{en:"Grateful", pt:"grato", type:"adjective"},

/* SUBSTANTIVO */
{en:"Car", pt:"carro", type:"noun"}

];

let currentWord=null;

function randomWord(){

let index=Math.floor(Math.random()*words.length);
currentWord=words[index];

document.getElementById("word").innerText=currentWord.en;
document.getElementById("translation").innerText="";
document.getElementById("past").innerText="";
document.getElementById("result").innerText="";
document.getElementById("answer").value="";

let input = document.getElementById("answer");
let btnCheck = document.getElementById("btnCheck");
let btnPast = document.getElementById("btnPast");

if(currentWord.type === "verb"){
input.classList.remove("hidden");
btnCheck.classList.remove("hidden");
btnPast.classList.remove("hidden");
}else{
input.classList.add("hidden");
btnCheck.classList.add("hidden");
btnPast.classList.add("hidden");
}

}

function showTranslation(){
if(currentWord){
document.getElementById("translation").innerText="Translation: "+currentWord.pt;
}
}

function showPast(){
if(currentWord && currentWord.type==="verb"){
document.getElementById("past").innerText="Past: "+currentWord.past;
}
}

function checkAnswer(){

if(!currentWord || currentWord.type!=="verb") return;

let userAnswer=document.getElementById("answer").value.trim().toLowerCase();
let correct=currentWord.past.toLowerCase();

if(userAnswer===correct){
document.getElementById("result").innerText="✅ Correct!";
document.getElementById("result").style.color="#22c55e";
}else{
document.getElementById("result").innerText="❌ Wrong! Correct: "+currentWord.past;
document.getElementById("result").style.color="#ef4444";
}

}

</script>

</body>
</html>
